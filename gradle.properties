# Memory is capped so the build also fits small machines (a full build once froze a 5.6 GB server without swap).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# GitHub repository whose releases local builds check for updates (Actions builds use their own repository)
updateRepo=techkrzysiek/BetterNVR
# Ed25519 public key of the release workflow's UPDATE_SIGNING_KEY secret; updates must be signed with it
updateKey=563e28ec13b87375f5ac833b27c7ce4b48d307103610bb1843525dbeb655ce1c
kotlin.code.style=official
android.nonTransitiveRClass=true
