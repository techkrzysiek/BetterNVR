# Push a tag like v0.1.6 → signed APK on the GitHub release page; the app offers it as an update.
# Needs repository secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# (the same key as every earlier release – Android installs updates only over an app signed with the same key).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # No third-party actions in the job that handles the signing key (the build workflow validates the wrapper).
      - name: Release key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret RELEASE_KEYSTORE_BASE64 is missing (see README, Releases)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Signed APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon assembleRelease -PappVersion="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "BetterNVR-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Check the signing key
        env:
          # SHA-256 of the release certificate: installed apps accept updates only with this key
          RELEASE_CERT_SHA256: 322ef00c5ac9fa17dd12edb3498392b00f1d2d2d39361ba5a7e84ac70bb7a613
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          CERT=$("$APKSIGNER" verify --print-certs BetterNVR-*.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "APK certificate SHA-256: $CERT"
          if [ "$CERT" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::The APK is not signed with the release key (check the RELEASE_* secrets)"; exit 1
          fi
          for f in BetterNVR-*.apk; do sha256sum "$f" > "$f.sha256"; done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" BetterNVR-*.apk BetterNVR-*.apk.sha256 \
            --title "BetterNVR ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
