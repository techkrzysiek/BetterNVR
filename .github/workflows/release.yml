# Push a tag like v0.1.6 → signed APK on the GitHub release page; the app offers it as an update.
# Needs repository secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# (the same key as every earlier release – Android installs updates only over an app signed with the same key),
# and UPDATE_SIGNING_KEY: the Ed25519 private key (PEM) whose public half is `updateKey` in gradle.properties.
# The app installs an update only when the APK's .sig file is a valid Ed25519 signature from that key.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # No third-party actions in the job that handles the signing key (the build workflow validates the wrapper).
      - name: Release key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret RELEASE_KEYSTORE_BASE64 is missing (see the top of this workflow)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Signed APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon assembleRelease -PappVersion="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "BetterNVR-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Check the signing key
        env:
          # SHA-256 of the release certificate: installed apps accept updates only with this key
          RELEASE_CERT_SHA256: 322ef00c5ac9fa17dd12edb3498392b00f1d2d2d39361ba5a7e84ac70bb7a613
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          CERT=$("$APKSIGNER" verify --print-certs BetterNVR-*.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "APK certificate SHA-256: $CERT"
          if [ "$CERT" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::The APK is not signed with the release key (check the RELEASE_* secrets)"; exit 1
          fi
          for f in BetterNVR-*.apk; do sha256sum "$f" > "$f.sha256"; done
      - name: Update signature (Ed25519)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Repository secret UPDATE_SIGNING_KEY is missing: the Ed25519 private key (PEM) of updateKey in gradle.properties"; exit 1
          fi
          KEY="$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" | tr -d '\r' > "$KEY"
          openssl pkey -in "$KEY" -pubout -out "$RUNNER_TEMP/update-key.pub"
          # installed apps trust only the public key they were built with
          WANT=$(sed -n 's/^updateKey=//p' gradle.properties | tr -d '[:space:]' | tr 'A-F' 'a-f')
          HAVE=$(openssl pkey -pubin -in "$RUNNER_TEMP/update-key.pub" -outform DER | tail -c 32 | od -An -v -tx1 | tr -d ' \n')
          echo "Update key: $HAVE"
          if [ "$HAVE" != "$WANT" ]; then
            echo "::error::UPDATE_SIGNING_KEY does not match updateKey in gradle.properties"; exit 1
          fi
          for f in BetterNVR-*.apk; do
            openssl pkeyutl -sign -rawin -inkey "$KEY" -in "$f" -out "$f.sig"
            openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update-key.pub" -in "$f" -sigfile "$f.sig"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" BetterNVR-*.apk BetterNVR-*.apk.sha256 BetterNVR-*.apk.sig \
            --title "BetterNVR ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
